services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: quantbook
      POSTGRES_PASSWORD: quantbook_dev
      POSTGRES_DB: quantbook
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantbook -d quantbook"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
